<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OX Processing · Crypto checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <header class="topbar">
      <div class="brand">
        <span class="logo-mark">OX</span>
        <div>
          <strong>OX Processing</strong>
          <p>Crypto checkout</p>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="panel checkout">
        <p class="form-error hidden" id="formError"></p>

        <form id="payForm">
          <div class="grid">
            <label>
              Amount
              <input name="amount" type="text" required />
            </label>
            <label>
              Currency
              <select name="currency_iso" required>
                <option value="USDT (TRC20)">USDT (TRC20)</option>
                <option value="USDT (ERC20)">USDT (ERC20)</option>
                <option value="USDT (BEP20)">USDT (BEP20)</option>
                <option value="USDC (ERC20)">USDC (ERC20)</option>
                <option value="BTC">BTC</option>
                <option value="ETH">ETH</option>
                <option value="TRX">TRX</option>
                <option value="LTC">LTC</option>
              </select>
            </label>
            <label class="span-2">
              Email
              <input name="end_user_email" type="email" required />
            </label>
            <label>
              First name
              <input name="first_name" type="text" />
            </label>
            <label>
              Last name
              <input name="last_name" type="text" />
            </label>
            <label class="span-2">
              Customer ID
              <input name="end_user_reference" type="text" />
            </label>
          </div>

          <button
            class="test-pay"
            type="button"
            id="testPayBox"
            aria-label="Test pay"
            aria-pressed="false"
          >
            <span class="test-pay-check" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="12" height="12">
                <path
                  d="M3.5 8.5l3 3 6-7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <strong>Test pay</strong>
          </button>

          <button class="cta" type="submit" id="submitBtn">
            Create payment request
          </button>
        </form>
      </section>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
