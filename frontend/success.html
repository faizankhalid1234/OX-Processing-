<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment successful</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="state-page">
      <div class="state-card">
        <p class="eyebrow ok">Confirmed</p>
        <h1>Payment received</h1>
        <p class="hint" id="msg">Waiting for webhook confirmation…</p>
        <a class="ghost" href="/">Back to checkout</a>
      </div>
    </div>
    <script src="/js/config.js"></script>
    <script src="/js/status.js"></script>
    <script>
      startStatusPoll({
        onStatus(status, id) {
          if (status === "failed" || status === "expired") {
            location.replace("/failed.html?foreign_id=" + encodeURIComponent(id));
          }
        },
      });
    </script>
  </body>
</html>
